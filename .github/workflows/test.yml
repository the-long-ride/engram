name: Test & Coverage

on:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'website/**'
      - 'documentation/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.cjs'
      - '.github/workflows/test.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/deploy-docs.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'website/**'
      - 'documentation/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'jest.config.cjs'
      - '.github/workflows/test.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Shard the full suite across both supported Node lines. Each test still runs on Node 20 and 24,
  # but independent shards finish in parallel and every job has a hard upper bound.
  verify:
    name: Full suite (Node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
        shard: ['1/2', '2/2']
    env:
      TEST_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build already runs tsc, so a separate typecheck would duplicate the compiler pass.
      - name: Build and typecheck
        run: npm run build

      - name: Line check
        if: matrix.node == 24 && matrix.shard == '1/2'
        run: npm run lint:lines

      - name: Run sharded full test suite
        run: npm run test:built

  # Coverage already executes its selected tests, so keep it out of every full-suite matrix job.
  coverage:
    name: Coverage (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

  # Website checks are Node-24-only and no longer repeated once per root Node matrix entry.
  website:
    name: Website tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup website Node cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Typecheck website
        working-directory: website
        run: pnpm typecheck

      # Coverage executes the website test files too; do not run pnpm test immediately before it.
      - name: Run website coverage
        working-directory: website
        run: |
          node --input-type=module -e "import('../scripts/run-related-tests.mjs').then(async ({ websiteTestFiles }) => console.log((await websiteTestFiles()).join('\n')))" > /tmp/website-tests.txt
          node --experimental-test-coverage --import tsx --test --test-isolation=none --test-timeout=120000 --test-force-exit $(cat /tmp/website-tests.txt)

  # Cross-platform smoke job: catches path/config/CLI regressions without rerunning the full suite.
  smoke:
    name: Smoke (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:core builds first, which already performs the TypeScript compiler pass.
      - name: Core smoke tests
        run: npm run test:core

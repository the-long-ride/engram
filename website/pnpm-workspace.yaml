allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  core-js: true
  esbuild: true
overrides:
  braces: 'file:./vendor/braces-safe'
  shell-quote: '^1.11.0'
  tinypool: '^2.1.2'
  postcss-selector-parser: '^7.1.6'
  compression: '^1.8.2'
  proxy-addr: '^2.0.8'
  source-map-js: '^1.2.2'
  # 0.18.5+ adds commander 15 (Node 22); keep patched releases compatible with Node 20.
  katex: '>=0.18.2 <0.18.5'
  http-cache-semantics: '^4.2.1'
  qs: '^6.17.1'
  joi: '^17.13.9'
  colord: '^2.9.4'
  body-parser: '^1.20.9'
  brace-expansion: '^2.1.7'
  dompurify: '^3.5.0'
  fast-uri: '^3.1.9'
  follow-redirects: '^1.16.3'
  js-yaml: '^5.4.2'
  image-size: 'link:./vendor/image-size-safe'
  launch-editor: '^2.14.2'
  mermaid: '^11.16.1'
  nanoid: '^5.1.5'
  pdfjs-dist: '^6.2.108'
  postcss: '^8.5.23'
  postcss-svgo>svgo: '^3.3.5'
  serialize-javascript: '^7.1.4'
  svgo: '^3.3.5'
  undici: '^7.30.1'
  uuid: '^11.1.1'
packages:
  - '.'

onlyBuiltDependencies:
  - '@swc/core'
  - core-js
  - esbuild
